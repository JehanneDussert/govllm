server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Vue Router - return all routes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache assets
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}